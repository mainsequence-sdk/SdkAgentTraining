success:
- Derives output storage identity from source table UID, source cadence, upsample frequency, and interpolation rule
- Exposes source price DataNode or APIDataNode as an explicit dependency
- Keeps storage identity components out of row columns unless they are real observations
- Validates asset-scoped incremental output and nanosecond UTC index

description: 'Use this skill when the task is about creating, updating, validating,
  or reviewing Main Sequence Command Center workspaces after the workspace design
  is known. This skill owns workspace documents, widget instance payload resolution,
  safe mutation, shared versus user state, widget-scoped mutation, connection-backed
  source widget mounting, and grounding those decisions against the richer widget-type
  registry contract plus the SDK command_center client models. Use workspace_design
  first when the task is still about deciding which widgets, layout, narrative, or
  visualization strategy should express the user intent; use command-center-connections
  first when source data or query contracts are unresolved. Source order is strict:
  registry detail first, SDK client models second, local Main Sequence repository
  docs/models third only when the first two still leave instance payload questions
  unresolved. Main Sequence is platform-first: if a mounted widget or AppComponent
  depends on a project API, that API must already exist as a FastAPI project resource
  and have a corresponding FastAPI ResourceRelease before the workspace flow is considered
  usable. Resource and release creation belong to the orchestration-and-releases skill.
  It does not own AppComponent form contracts, API implementation, workspace design,
  or Streamlit dashboards.'

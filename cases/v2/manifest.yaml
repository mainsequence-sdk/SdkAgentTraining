case_set_version: v2
description: Second authored case-set version for Main Sequence skill evaluation after
  the SDK 4.x skill-bundle change.
derived_from_case_set: v1
target_sdk_version: 4.4.5
migration_status: pending_revalidation
notes:
- This case set is versioned independently from SDK snapshots.
- Existing compatible skill paths were migrated from v1 as a baseline.
- Every migrated case must be revalidated against the SDK 4.4.5 skill text before
  being marked current.
- New SDK skill paths start with empty case folders until cases are authored.

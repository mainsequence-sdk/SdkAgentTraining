id: or-037-decide-if-local-file-path-is-acceptable
title: Reject fragile local file paths in operational workflows
skill_path: platform_operations/orchestration_and_releases
sdk_version: 3.17.33
tags:
- decision
- artifacts
- files
- safety
difficulty: medium
requires:

skill_path: command_center/adapter_from_api
display_name: command-center-adapter-from-api
description: Use when building or changing an API so Command Center can consume it
  through an Adapter from API connection. This skill defines the provider-side API
  contract standards required for Command Center connection discovery, health checks,
  operation selection, config fields, secret injection metadata, canonical `TabularFrameResponse`
  outputs, and optional response-mapping metadata for frontend/editor context or future
  explicit transforms. It does not define general API architecture and does not imply
  the API may only serve these endpoints.

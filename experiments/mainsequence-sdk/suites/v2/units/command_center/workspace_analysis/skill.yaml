display_name: command-center-workspace-analysis
description: Use this skill when the task is about analyzing a Main Sequence Command
  Center workspace snapshot and answering questions about the current state of the
  workspace. This skill is for interpreting what the workspace was actually showing
  at capture time. Each widget snapshot contains that widget's current state, and
  agents should answer questions from those widget dumps instead of from persisted
  workspace metadata.

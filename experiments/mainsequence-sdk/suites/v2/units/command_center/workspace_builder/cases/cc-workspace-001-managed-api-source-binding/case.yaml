success:
  - Uses a connection-backed source widget instead of embedding backend route details in the consumer.
  - Binds the source widget output to the consumer widget input through target-owned bindings.
  - Keeps the hidden managed source linked to its owner widget.
  - Distinguishes workspace JSON from runtime/user state.
  - Lists the CLI and registry verification needed before mutating a real workspace.

success:
  - Treats the API as a FastAPI consumer surface, not a producer implementation.
  - Uses explicit route response models and rich FastAPI parameter metadata.
  - Uses the canonical Command Center tabular response contract for the widget-facing endpoint.
  - Keeps route handlers thin and delegates composition to service helpers.
  - States the resource and release checks required before calling the API usable from Command Center.

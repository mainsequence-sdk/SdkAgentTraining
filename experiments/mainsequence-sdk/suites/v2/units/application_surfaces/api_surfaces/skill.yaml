display_name: mainsequence-api-surfaces
description: 'Use this skill when the task is about building or changing APIs in a
  Main Sequence repository. In a Main Sequence project, project APIs should be implemented
  as FastAPI project resources. Unless the user explicitly says the API is standalone
  or for a non-Command Center client, assume the API is meant to be Command Center
  integrated, load the related Command Center skills, and use Command Center SDK response
  models whenever the endpoint can reasonably match them. Main Sequence is platform-first:
  a Command Center-facing project API is not considered usable until it exists as
  a FastAPI project resource and has a corresponding FastAPI ResourceRelease. Resource
  and release creation belong to the orchestration-and-releases skill. This skill
  owns FastAPI structure, request and response contracts, request user binding, APIDataNode
  and MetaTable consumption inside APIs, and exact widget-facing API response contracts.
  It does not own producer-side DataNode or MetaTable design, workspace payloads,
  or scheduling and release workflows.'

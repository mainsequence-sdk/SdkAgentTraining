success:
  - Chooses Secret instead of Constant for a provider API key.
  - Treats the name as a unique configuration identity and checks for existing objects.
  - Reads the Secret through the SDK without hardcoding or logging the value.
  - Handles missing or empty secret values as configuration errors.
  - Separates access-control concerns from API/provider business logic.

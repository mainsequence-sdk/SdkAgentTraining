id: ac-006-provider-api-key-secret
title: Keep an external provider API key in a Secret and read it from SDK code
skill_path: platform_operations/access_control_and_sharing
case_set_version: v2
authored_against_sdk_version: 4.4.5
target_sdk_version: 4.4.5

    description: Must choose `Secret`, not `Constant`, for the provider API key.
  - id: no-secret-exposure
    description: Must not expose the secret value in code, logs, API responses, public config, or connection JSON.
  - id: sdk-read
    description: Must read the value through the SDK by secret name.
criteria:

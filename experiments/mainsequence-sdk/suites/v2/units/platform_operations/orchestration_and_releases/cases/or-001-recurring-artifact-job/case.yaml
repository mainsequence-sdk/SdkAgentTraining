success:
- Chooses a repository-managed recurring workflow instead of an ad hoc manual job
- Uses `scheduled_jobs.yaml` for the recurring schedule
- Treats `Artifact` as the correct file primitive for vendor file drops
- Pins the job to a project image with `related_image_id`
- Avoids `--strict` unless full desired state is explicitly intended
- Verifies the created job through job listing, runs, and logs

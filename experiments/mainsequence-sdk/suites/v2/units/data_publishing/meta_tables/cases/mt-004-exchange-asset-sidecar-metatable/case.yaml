success:
- Models exchange-specific asset metadata as a sidecar table linked to canonical assets
- Preserves one row per canonical asset and useful lookup paths by exchange symbol and kind
- Separates durable reference state from time-indexed observations
- Routes creation/evolution through migration-managed MetaTables

  description: Must use SDK-managed Alembic migration workflow, not direct registration.
- id: provider-scope
  description: Must recommend one provider for the shared market stack unless an explicit lifecycle boundary exists.
- id: helper-pattern
  description: Must use SDK helper builders or generated scaffold pattern.
criteria:

  weight: 0.2
  description: Correctly describes package, namespace, script location, metadata, alembic registry, and metatable models.
- id: model-registry
  weight: 0.2
  description: Uses explicit de-duplicated model registry covering all three import roots.
- id: cli-workflow
  weight: 0.2
  description: Includes correct `current`, `revision`, and `upgrade` commands with provider path.
- id: lifecycle-explanation
  weight: 0.2
  description: Explains provider-scoped reserve, Alembic DDL, finalization, and optional hook.
- id: runtime-boundary
  weight: 0.1

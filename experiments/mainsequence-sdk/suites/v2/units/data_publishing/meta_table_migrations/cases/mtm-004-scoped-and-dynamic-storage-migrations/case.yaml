id: mtm-004-scoped-and-dynamic-storage-migrations
title: Design scoped and dynamic storage migration providers
skill_path: data_publishing/meta_table_migrations
case_set_version: v2
authored_against_sdk_version: 4.4.5
target_sdk_version: 4.4.5
tags:
- meta_table_migrations
- scoped-provider
- dynamic-storage
- alembic
- bars
- difficult
difficulty: hard
requires:
  network: false
  auth: false
  writes_code: false
success:
- Uses one shared migration history while allowing scoped revisions for selected optional tables
- Includes FK dependency metadata without migrating dependency tables owned elsewhere
- Handles dynamic storage whose identity depends on registered source metadata
- Fails clearly before revision/upgrade when required dynamic source metadata is missing

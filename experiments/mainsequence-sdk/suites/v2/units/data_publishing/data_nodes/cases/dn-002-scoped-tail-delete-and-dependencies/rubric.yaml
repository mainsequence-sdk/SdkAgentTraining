- id: rollback-semantics
  weight: 0.15
  description: Distinguishes global tail rollback, scoped tail rollback, and scoped full-stream delete.
- id: routing
  weight: 0.15
  description: Routes schema/FK work to MetaTables and migration lifecycle to MetaTable migrations.
- id: validation
